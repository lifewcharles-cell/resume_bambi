<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>BAMBI music</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="redesign.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda+SC:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="grain"></div>
    <!-- NAV (FLOATING MINIMAL) -->
    <nav>
      <div class="nav-inner">
        <h1>BAMBI MUSIC</h1>
        <div class="nav-links">
          <a href="#music">Music</a>
          <a href="#tour">Tour</a>
          <a href="#about">About</a>
        </div>
      </div>
    </nav>

    <!-- HERO -->
    <section class="hero">
      <!-- DARK OVERLAY -->
      <div class="overlay"></div>

      <!-- FLOATING LIGHT ORB -->
      <div class="orb"></div>

      <div class="hero-content">
        <p class="tag">welcome</p>
        <h2>WE ARE FREE</h2>
        <button>Listen Now</button>
      </div>
    </section>
    <p class="release-title">NEW Release</p>
    <!-- MUSIC / PLAYER -->
    <section id="music" class="music">
      <div class="vertical-space"></div>
      <div class="music-grid">
        <div class="player">
          <iframe
            title="Spotify music player"
            src="https://open.spotify.com/embed/track/2Qdvu7Bcw2BfFoJo7ovRHk?utm_source=generator"
            width="100%"
            height="152"
            style="border: none; border-radius: 8px"
            allow="
              autoplay;
              clipboard-write;
              encrypted-media;
              fullscreen;
              picture-in-picture;
            "
          >
          </iframe>
        </div>

        <div class="tracklist">
          <h3>Releases</h3>
          <p>EP 01 — 2026</p>
          <p>Album 02 — 2025</p>
          <p>Single — 2024</p>
        </div>
      </div>
    </section>

    <!-- TOUR -->
    <section id="tour" class="tour">
      <h3>Upcoming</h3>
      <div class="tour-list">
        <div class="show">Berlin — TBD</div>
        <div class="show">NYC — TBD</div>
        <div class="show">Tokyo — TBD</div>
      </div>
    </section>

    <!-- ABOUT -->
    <section id="about" class="about">
      <p>
        BAMBI operates within the darker edges of sounds, tension, repetition,
        and controlled chaos.
      </p>
    </section>

    <footer>
      <p>© BAMBI music</p>
    </footer>
  </body>
</html>
